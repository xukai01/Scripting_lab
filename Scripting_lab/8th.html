<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="8th.css">
</head>
<body>
    <div id="quiz">
        <h1>Quiz</h1>
        <div id="progress"></div>

        <div id="timer">Timer:10s</div>

            <h2 id="question">Question:</h2>
            <div id="options"></div>
        </div>
        <div id="output"></div>

        <div id="btn">
            <button type="button">Next</button>
        </div>
        <div id="score">Score:</div>
    </div>
    <script src="8th.js"></script>
</body>
</html>
