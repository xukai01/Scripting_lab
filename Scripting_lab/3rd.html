    <title>Personal Profile Card</title>

            align-items: center;
            height: 100vh;
            margin: 0;
            display: flex;

            text-align: center;
            /* font: Arial; */
            background-color: burlywood;
            /* font-size: 20px; */

        }
        .card{
            padding: 10px;
            border-style: bold black;
            background-color: white;
            box-shadow: 0px 15px 25px black;
            height: 420px;
            width: 300px;
            border-radius: 15px;
            align-items: center;
            box-sizing: border-box;
        }
        .img{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid black;
            margin-top: 10px;
            object-fit: cover;
        }
        a{
            text-decoration: none;
            padding: 5px;
            display: block;

        h2{

</head>
