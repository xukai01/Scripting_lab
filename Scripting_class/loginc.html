            function generateCaptcha() {
                const operators = "+-*/";

                let num1 = Math.floor(Math.random() * 10 + 1);
                let num2 = Math.floor(Math.random() * 10 + 1);
                let num3 = Math.floor(Math.random() * 10 + 1);
                let num4 = Math.floor(Math.random() * 10 + 1);

                let op1 = operators.charAt(Math.floor(Math.random() * operators.length));
                let op2 = operators.charAt(Math.floor(Math.random() * operators.length));
                let op3 = operators.charAt(Math.floor(Math.random() * operators.length));

                captchaText = num1 + op1 + num2 + op2 + num3;

                drawCaptcha();
            }

            function drawCaptcha() {
                const canvas = document.getElementById("captchaCanvas");
                const ctx = canvas.getContext("2d");

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.font = "30px Arial";
                ctx.fillStyle = "#000";
                ctx.fillText(captchaText, 40, 35);

                for (let i = 0; i < 3; i++) {
                    ctx.strokeStyle = "#" + Math.floor(Math.random()*16777215).toString(16);
                    ctx.beginPath();
                    ctx.moveTo(Math.random() * 200, Math.random() * 50);
                    ctx.lineTo(Math.random() * 200, Math.random() * 50);
                    // ctx.stroke();
                }
            }

            function togglePassword(){
                let pass = document.getElementById("password");
